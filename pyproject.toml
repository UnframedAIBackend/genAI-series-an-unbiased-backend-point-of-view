[project]
name = "adaptable-backend-python"
version = "0.1.0"
description = "An adaptable backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "pydantic>=2.10.3",
    "uvicorn[standard]>=0.32.1",
    "dependency-injector>=4.41.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pymongo>=4.15.5",
    "python-multipart>=0.0.20",
    "pypdf>=6.4.1",
    "langchain-text-splitters>=1.0.0",
    "chonkie[semantic]>=1.4.2",
    "sentence-transformers>=5.1.2",
    "ragas>=0.4.1",
    "temporalio>=1.21.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
