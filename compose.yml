services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      TZ: America/Bogota
      PGTZ: America/Bogota
    networks:
      - genai-series
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]

  postgres_migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-base
    profiles: [ app ]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: make migrate-sql
    networks:
      - genai-series

  mongodb:
    build:
      context: ./containers/mongodb
      dockerfile: Dockerfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: mongo
    ports:
      - 27017:27017
    command: --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all --port 27017
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh --port 27017 -u mongo -p mongo --authenticationDatabase admin
      interval: 5s
      timeout: 15s
      start_period: 15s
      retries: 10
    volumes:
      - "mongo_data:/data/db"
      - "mongo_config:/data/configdb"
      - "./deploy/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro"
    networks:
      - genai-series

  mongo_migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-base
    profiles: [ app ]
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env
    command: make migrate-nosql
    networks:
      - genai-series

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull tinyllama && wait"
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genai-series

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    volumes:
      - mlflow_data:/mlflow
    networks:
      - genai-series

  temporal:
    image: temporalio/auto-setup:1.26.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - DBNAME=temporal
      - ENABLE_ES=false
      - SKIP_SCHEMA_SETUP=false
      - SKIP_DEFAULT_NAMESPACE_CREATION=false
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
      - LOG_LEVEL=info
    ports:
      - "7233:7233"
    networks:
      - genai-series
    healthcheck:
      test: [ "CMD", "tctl", "--address", "temporal:7233", "workflow", "list" ]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ./containers/temporal/config:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.44.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - genai-series

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    profiles: [ app ]
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'python.*worker.py' > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - genai-series
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    profiles: [ app ]
    depends_on:
      postgres_migrator:
        condition: service_healthy
      mongo_migrator:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - genai-series
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads

networks:
  genai-series:


volumes:
  postgres_data:
  mongo_data:
  mongo_config:
  ollama_data:
  mlflow_data:
  temporal_data:
