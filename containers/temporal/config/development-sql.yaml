# Temporal dynamic configuration for development with PostgreSQL
# This file configures Temporal to use separate schemas for persistence and visibility

# Enable search attributes
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

# Workflow execution retention
system.defaultWorkflowExecutionRetentionTime:
  - value: "168h" # 7 days
    constraints: {}

# History archival
system.enableArchival:
  - value: false
    constraints: {}

# Visibility configuration
system.advancedVisibilityWritingMode:
  - value: "on"
    constraints: {}

# Increase blob size limit to 1GB (default 2MB) - needed for large embeddings
limit.blobSize.errorLimit:
  - value: 1073741824  # 1GB
limit.blobSize.warnLimit:
  - value: 536870912   # 512MB

# Increase history size limits to accommodate large payloads (2GB for safety)
limit.historySize.error:
  - value: 2147483648  # 2GB
limit.historySize.warn:
  - value: 1073741824  # 1GB

# Increase history count limits
limit.historyCount.error:
  - value: 204800
limit.historyCount.warn:
  - value: 102400
